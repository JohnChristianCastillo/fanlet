name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Gradle itself only needs JDK 17+, but the build's daemon JVM is pinned to
      # JDK 25 in gradle/gradle-daemon-jvm.properties. Installing 25 here avoids a
      # toolchain download on every run.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies and validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v5

      # The release variant must keep building. It is unsigned here: no key in CI.
      # CI cannot start the app, so a release is tested on a phone before it is tagged
      # (see "Releasing" in the README).
      - name: Lint, unit tests, permission check, debug and release builds
        run: ./gradlew lint testDebugUnitTest check assembleDebug assembleRelease
